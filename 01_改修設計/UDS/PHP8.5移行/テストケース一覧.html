<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UDS PHP8.5 テストケース</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --text:#1f2933; --muted:#5f6b7a; --line:#dde2e8;
  --accent:#2563eb; --accent-soft:#e8efff;
  --hi:#b42318; --hi-bg:#fdecea; --mid:#9a6700; --mid-bg:#fff4d6; --lo:#4b5563; --lo-bg:#eef0f3;
  --ok:#0f7b3f; --ok-bg:#e5f6ec; --ng:#b42318; --ng-bg:#fdecea; --hold:#7a4cc2; --hold-bg:#f1eafd;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Noto Sans JP","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}
header{padding:20px 16px 8px;max-width:1500px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
main{max-width:1500px;margin:0 auto;padding:0 16px 40px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card .lbl{font-size:12px;color:var(--muted)}
.card .num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--lo-bg);overflow:hidden;display:flex;margin-top:6px}
.bar span{display:block;height:100%}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;position:sticky;top:0;z-index:2}
.filters label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
select,input[type=search]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text)}
input[type=search]{min-width:200px}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--accent)}
.count{margin-left:auto;font-size:12px;color:var(--muted)}
.tablewrap{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1100px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
th{background:#f0f3f7;font-size:12px;color:var(--muted);position:sticky;top:0}
td.id{white-space:nowrap;font-family:ui-monospace,Consolas,monospace;font-size:12px}
td.risk{color:var(--muted);font-size:12px;max-width:240px}
td.step{max-width:340px} td.exp{max-width:300px}
.cat{display:inline-block;font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 6px;margin-top:2px}
.pri{display:inline-block;border-radius:4px;padding:0 8px;font-size:12px;font-weight:700}
.pri.高{color:var(--hi);background:var(--hi-bg)} .pri.中{color:var(--mid);background:var(--mid-bg)} .pri.低{color:var(--lo);background:var(--lo-bg)}
tr.r-OK td{background:#f6fcf8} tr.r-NG td{background:#fff7f6}
td.res select{min-width:92px}
td.res input{width:100%;margin-top:4px;font:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
code{background:#f0f3f7;border-radius:4px;padding:0 4px;font-size:12px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:640px){.filters{position:static} input[type=search]{min-width:0;width:100%}}
</style>
</head>
<body>
<header>
  <h1>UDS PHP 8.5 移行 テストケース一覧</h1>
  <div class="sub">対象: uds-web（PHP 5.6 → 8.5.12 以上） / 作成日 2026-10-22 / 詳しくは テスト計画書.md を参照</div>
</header>
<main>
  <div class="summary" id="summary"></div>
  <div class="filters">
    <label>区分 <select id="fCat"><option value="">すべて</option></select></label>
    <label>優先度 <select id="fPri"><option value="">すべて</option><option>高</option><option>中</option><option>低</option></select></label>
    <label>結果 <select id="fRes"><option value="">すべて</option><option value="未">未実施</option><option>OK</option><option>NG</option><option>保留</option><option>対象外</option></select></label>
    <label>ロール <select id="fRole"><option value="">すべて</option></select></label>
    <input type="search" id="fText" placeholder="キーワード（対象・手順・リスク）">
    <button class="ghost" id="btnReset">絞り込み解除</button>
    <button id="btnCsv">結果を CSV 出力</button>
    <span class="count" id="count"></span>
  </div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>ID</th><th>対象</th><th>ロール</th><th>手順・観点</th><th>期待結果</th><th>優先度</th><th>PHP 8 のリスク・根拠</th><th>結果・メモ</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p class="note">結果とメモは、このブラウザの中だけに保存されます（他の人とは共有されません）。共有するときは「結果を CSV 出力」を使い、最終的な結果は テストケース一覧.md に書き写してください。</p>
</main>
<script>
const DATA = [{"id": "INF-01", "cat": "INF", "target": "PHPバージョン", "role": "-", "step": "`php -v` と、Web 経由の `phpinfo()`（確認後すぐ削除）でバージョンを確認する", "expect": "CLI・Web とも 8.5.12 以上", "pri": "高", "risk": "CVE-2026-109618/109619 の修正版"}, {"id": "INF-02", "cat": "INF", "target": "PHP拡張モジュール", "role": "-", "step": "`php -m` で拡張の一覧を出し、必要な拡張と照合する", "expect": "pdo_mysql・mbstring・gd（PNG/FreeType）・zip・xml・dom・xmlwriter・simplexml・curl・openssl・fileinfo・sodium・intl・bcmath・json がすべてある", "pri": "高", "risk": "zip は旧環境で明示インストールなし。sodium は Fuel 1.8 の Crypt で必要"}, {"id": "INF-03", "cat": "INF", "target": "緩和策の設定", "role": "-", "step": "`php -i | grep session.upload_progress.enabled` と、Web 経由の `ini_get` で確認する", "expect": "CLI・Web とも Off", "pri": "高", "risk": "暫定対応①が新サーバーで漏れないこと"}, {"id": "INF-04", "cat": "INF", "target": "php.ini（アップロード上限）", "role": "-", "step": "`upload_max_filesize`・`post_max_size` を確認し、19MB 程度の CSV を取り込む", "expect": "20M 以上。19MB の CSV が取り込める", "pri": "高", "risk": "CSV の上限は 20MB（config/upload.php）"}, {"id": "INF-05", "cat": "INF", "target": "php.ini（メモリ・実行時間）", "role": "-", "step": "`memory_limit`・`max_execution_time`・`max_input_time` を確認する", "expect": "旧環境と同じ以上（memory_limit=1024M、max_execution_time=30 など）。値を変えた場合は理由を記録する", "pri": "高", "risk": "Excel・PDF・大量 CSV 出力"}, {"id": "INF-06", "cat": "INF", "target": "php.ini（時刻）", "role": "-", "step": "`date.timezone` を確認し、画面で登録した日時と DB の値を見る", "expect": "Asia/Tokyo。画面・DB・CSV の日時が JST でずれない", "pri": "中", "risk": "旧サーバーでは CLI で timezone の警告が出ていた"}, {"id": "INF-07", "cat": "INF", "target": "php.ini（削除済みディレクティブ）", "role": "-", "step": "Apache を起動し、`php -v` と error_log に起動時の警告がないか見る", "expect": "asp_tags・track_errors・mysql.*・session.hash_* などが残っておらず、起動時の警告が出ない", "pri": "中", "risk": "PHP 7 以降で削除された設定"}, {"id": "INF-08", "cat": "INF", "target": "php.ini（エラー表示）", "role": "-", "step": "`display_errors`・`log_errors`・`error_log` の設定を確認する", "expect": "display_errors=Off、エラーはログにのみ出る", "pri": "高", "risk": "画面にスタックトレースが出ない"}, {"id": "INF-09", "cat": "INF", "target": "書き込み権限", "role": "-", "step": "Apache の実行ユーザーで、右のディレクトリに書き込めるか確認する", "expect": "fuel/app/logs・cache（session 含む）・uploaded・public/contents/{csv,img,pdf,zip,excel}・システムの一時ディレクトリ・TCPDF の fonts に書ける", "pri": "高", "risk": "セッション・CSV・ZIP・QR の PNG・フォント生成"}, {"id": "INF-10", "cat": "INF", "target": "Apache の PHP 実行方式", "role": "-", "step": "mod_php（php_module）か php-fpm かを確認し、/manage/login が表示されるか見る", "expect": "ログイン画面が表示される", "pri": "高", "risk": "mod_php5 から変わる"}, {"id": "INF-11", "cat": "INF", "target": ".htaccess のルーティング", "role": "-", "step": "`/manage/center/request?cecd[]=1&page=2` のように、パス＋クエリ文字列付きの URL へアクセスする", "expect": "旧環境と同じ画面・検索結果になる（クエリ文字列が消えない）", "pri": "高", "risk": "`<IfModule mod_php5.c>` ではない側の書き換えルール（index.php?/$1 [QSA]）になる"}, {"id": "INF-12", "cat": "INF", "target": "Apache のセキュリティヘッダ", "role": "-", "step": "レスポンスヘッダを確認する（ブラウザの開発者ツール）", "expect": "X-Frame-Options・X-Content-Type-Options が旧環境と同じ", "pri": "低", "risk": ""}, {"id": "INF-13", "cat": "INF", "target": "FUEL_ENV", "role": "-", "step": "Apache の SetEnv などで FUEL_ENV が設定されているか確認する", "expect": "環境に合った値（production / staging）になり、その環境の DB・設定を読む", "pri": "高", "risk": "未設定だと test 環境になり、別の DB を見る"}, {"id": "INF-14", "cat": "INF", "target": ".env の読み込み", "role": "-", "step": "public/.env の各キー（BUCKET_NAME・UNEXT_BASE_URL・ARTERIA_REQUEST_SQS_URL など）が設定され、S3・API が動くか確認する", "expect": "S3・SQS・U-NEXT API が正しい宛先に接続する", "pri": "高", "risk": ""}, {"id": "INF-15", "cat": "INF", "target": "DB 接続・文字コード", "role": "-", "step": "Aurora への接続を確認し、4 バイト文字（𠮷）と機種依存文字（①㈱髙）を画面から登録・表示する", "expect": "接続でき、文字化けしない（4 バイト文字は旧環境と同じ挙動）", "pri": "高", "risk": "charset はローカル以外 utf8。テーブルは utf8mb4"}, {"id": "INF-16", "cat": "INF", "target": "S3 の権限", "role": "-", "step": "IAM ロール（インスタンスプロファイル）で S3 の put・get・head・delete・署名 URL が使えるか確認する", "expect": "すべて成功する", "pri": "高", "risk": "新サーバーへのロール付け忘れ"}, {"id": "INF-17", "cat": "INF", "target": "SQS の権限", "role": "-", "step": "SQS FIFO（Arteria）へ送信できるか確認する", "expect": "送信が成功する", "pri": "中", "risk": ""}, {"id": "INF-18", "cat": "INF", "target": "外部 API への疎通", "role": "-", "step": "新サーバーから U-NEXT API・Arteria 宛ての通信（セキュリティグループ・NAT・送信元 IP の制限）を確認する", "expect": "疎通できる（送信元 IP の制限がある場合は先方への登録が済んでいる）", "pri": "高", "risk": "サーバーを作り直すと送信元 IP が変わる可能性"}, {"id": "INF-19", "cat": "INF", "target": "ログ出力", "role": "-", "step": "操作後に application.log（Monolog）と Fuel ログ（logs/YYYY/MM）を確認する", "expect": "どちらにも出力され、ローテーションも旧環境と同じ", "pri": "中", "risk": "Monolog の更新"}, {"id": "INF-20", "cat": "INF", "target": "cron", "role": "-", "step": "旧サーバーの crontab（uds ユーザー・root の両方）を確認し、新サーバーと比べる", "expect": "移行漏れがない（リポジトリ上は cron なし）", "pri": "中", "risk": "リポジトリにない cron が本番だけにある可能性"}, {"id": "INF-21", "cat": "INF", "target": "ライブラリの配置", "role": "-", "step": "composer install の結果と、手動配置のライブラリ（AWS SDK・phpqrcode）のバージョンを確認する", "expect": "移行計画で決めたバージョンになっている。不要なライブラリ（Smarty・php-markdown・Image_QRCode）が残っていない", "pri": "中", "risk": ""}, {"id": "INF-22", "cat": "INF", "target": "TCPDF フォント", "role": "-", "step": "初めて PDF を出力したときに、IPA フォント（ipagp）が生成されるか確認する", "expect": "フォントファイルが生成され、日本語が表示される", "pri": "高", "risk": "TCPDF を更新すると生成済みのフォントが消える"}, {"id": "INF-23", "cat": "INF", "target": "ヘルスチェック・HTTPS", "role": "-", "step": "ALB（ロードバランサー）のヘルスチェックと HTTPS でのアクセスを確認する", "expect": "ヘルスチェックが正常で、HTTPS で表示される", "pri": "高", "risk": ""}, {"id": "INF-24", "cat": "INF", "target": "WAF の暫定ルール", "role": "-", "step": "AWS WAF に暫定ルール（本文サイズの制限、PHP_SESSION_UPLOAD_PROGRESS の遮断）を入れている場合、通常の CSV アップロードを行う", "expect": "通常の業務アップロードが遮断されない", "pri": "中", "risk": "8KB を超える本文を制限するルールは CSV アップロードを止める"}, {"id": "AUT-01", "cat": "AUT", "target": "ログイン（全ロール）", "role": "全 7 ロール", "step": "admin・center・branch・external・cp・jimu・hoshu の各ユーザーでログインする", "expect": "ロールごとに決まった画面へ移動する（admin は master/device、center は center/request など）", "pri": "高", "risk": "セッション・Crypt（Fuel 更新）"}, {"id": "AUT-02", "cat": "AUT", "target": "ログイン失敗", "role": "-", "step": "パスワード誤り・未入力・存在しないユーザーでログインする", "expect": "旧環境と同じエラーメッセージが出て、ログイン画面に戻る", "pri": "高" }, {"id": "LNK-04", "cat": "LNK", "target": "SQS（Arteria）", "role": "center", "step": "PPPoE 削除などで SQS に送信し、メッセージの中身を確認する", "expect": "MessageGroupId と本文が旧環境と同じ", "pri": "高", "risk": ""}, {"id": "LNK-05", "cat": "LNK", "target": "U-NEXT API", "role": "admin", "step": "5G 変更 API を、成功・失敗（API のエラー応答）・タイムアウトで呼ぶ", "expect": "結果の表示が旧環境と同じ", "pri": "高", "risk": "Request::forge(curl)・response code を === で比較"}, {"id": "LNK-06", "cat": "LNK", "target": "UX 開局の SQS（既存の挙動）", "role": "center", "step": "UME(TV) の引き当てを確定する", "expect": "旧環境と同じ（現状は redirect の後にあるため送信されない。扱いは計画書の判断事項を参照）", "pri": "低", "risk": ""}, {"id": "TSK-01", "cat": "TSK", "target": "change_branch", "role": "-", "step": "`php oil r change_branch \"支店名\" \"serial,...\"` を stg で実行する", "expect": "serials と shipping_requests の支店が更新され、警告が出ない", "pri": "中", "risk": ""}, {"id": "TSK-02", "cat": "TSK", "target": "serial_to_new", "role": "-", "step": "`php oil r serial_to_new` を stg で実行する", "expect": "新品入庫のステータスに戻る", "pri": "中", "risk": ""}, {"id": "TSK-03", "cat": "TSK", "target": "oil コマンド", "role": "-", "step": "`php oil -v`・`php oil r` などの基本コマンド", "expect": "エラー・非推奨の警告が出ない", "pri": "低", "risk": ""}, {"id": "PRF-01", "cat": "PRF", "target": "代表画面の応答時間", "role": "center", "step": "依頼リスト・端末管理リスト・SIM 管理リストの検索を、旧環境と新環境でそれぞれ 3 回計る", "expect": "新環境が旧環境より明らかに遅くない（目安 1.2 倍以内）", "pri": "中", "risk": ""}, {"id": "PRF-02", "cat": "PRF", "target": "大量の CSV 出力", "role": "admin", "step": "SIM 一覧（最大件数）・端末リスト（全件）を出力する", "expect": "タイムアウト・メモリ不足にならず、時間が旧環境と同程度", "pri": "中", "risk": ""}, {"id": "PRF-03", "cat": "PRF", "target": "大量の CSV 取り込み", "role": "admin", "step": "デバイス種別マスタ・新規端末登録（本番相当の件数）を取り込む", "expect": "タイムアウトせず、時間が旧環境と同程度", "pri": "中", "risk": ""}, {"id": "PRF-04", "cat": "PRF", "target": "出荷 ZIP の生成", "role": "center", "step": "一度に多くの依頼（本番の最大相当）を出荷確定する", "expect": "タイムアウトしない", "pri": "中", "risk": ""}, {"id": "MIG-01", "cat": "MIG", "target": "切替手順のリハーサル", "role": "-", "step": "stg で、本番と同じ手順（DNS や ALB ターゲットの切り替え）を通しで行う", "expect": "手順書どおりに切り替えられ、かかった時間を記録する", "pri": "高", "risk": ""}, {"id": "MIG-02", "cat": "MIG", "target": "切り戻し手順のリハーサル", "role": "-", "step": "切り替えた後に、旧サーバーへ戻す手順を通しで行う", "expect": "決めた時間内に戻せる", "pri": "高", "risk": ""}, {"id": "MIG-03", "cat": "MIG", "target": "切替直後のスモークテスト", "role": "全ロール", "step": "本番切替の直後に、ログイン（全ロール）・依頼リスト・出荷確定（1 件）・CSV 出力・PDF 出力を行う", "expect": "すべて正常", "pri": "高", "risk": ""}, {"id": "MIG-04", "cat": "MIG", "target": "切替をまたいだデータ", "role": "jimu", "step": "旧環境で出力した履歴を、新環境から再ダウンロードする", "expect": "ダウンロードできる", "pri": "中", "risk": ""}, {"id": "MIG-05", "cat": "MIG", "target": "旧サーバーの保持", "role": "-", "step": "切り替えた後、決めた期間は旧サーバーを停止したまま残す", "expect": "切り戻しに使える状態で残っている", "pri": "中", "risk": ""}];
const CATS = {"INF": "基盤（OS・PHP・Apache・接続）", "AUT": "認証・セッション・権限", "CMN": "横断（エラー監視・異常系）", "CEN": "センター画面", "JIM": "事務画面", "BRA": "現地（branch）画面", "EXT": "外部委託（external）画面", "CP": "CP画面", "HOS": "保守委託（hoshu）画面", "MST": "マスター管理画面", "UPL": "CSV取り込み", "DL": "CSV出力", "XLS": "Excel出力", "PDF": "PDF・QRラベル", "LNK": "外部連携（S3・SQS・API）", "TSK": "oilタスク", "PRF": "性能", "MIG": "切替・切り戻し"};
const KEY = "uds-php85-test-results";
let results = {};
try { results = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { results = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(results)); } catch (e) {} }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

Object.entries(CATS).forEach(([k, v]) => $("fCat").insertAdjacentHTML("beforeend", `<option value="${k}">${k}: ${esc(v)}</option>`));
const roles = new Set();
DATA.forEach(d => d.role.split("・").forEach(r => { r = r.trim(); if (r && r !== "-") roles.add(r); }));
[...roles].sort().forEach(r => $("fRole").insertAdjacentHTML("beforeend", `<option>${esc(r)}</option>`));

function resOf(id){ return (results[id] && results[id].r) || "未"; }

function render(){
  const cat = $("fCat").value, pri = $("fPri").value, res = $("fRes").value, role = $("fRole").value, q = $("fText").value.trim().toLowerCase();
  const rows = DATA.filter(d =>
    (!cat || d.cat === cat) && (!pri || d.pri === pri) && (!res || resOf(d.id) === res) &&
    (!role || d.role.includes(role)) &&
    (!q || (d.id + d.target + d.role + d.step + d.expect + d.risk).toLowerCase().includes(q)));
  $("tbody").innerHTML = rows.map(d => {
    const r = resOf(d.id), memo = (results[d.id] && results[d.id].m) || "";
    return `<tr class="r-${r}" data-id="${d.id}">
      <td class="id">${d.id}<br><span class="cat">${esc(CATS[d.cat])}</span></td>
      <td>${fmt(d.target)}</td><td>${fmt(d.role)}</td>
      <td class="step">${fmt(d.step)}</td><td class="exp">${fmt(d.expect)}</td>
      <td><span class="pri ${d.pri}">${d.pri}</span></td>
      <td class="risk">${fmt(d.risk)}</td>
      <td class="res"><select>${["未","OK","NG","保留","対象外"].map(o => `<option ${o===r?"selected":""}>${o}</option>`).join("")}</select>
        <input type="text" placeholder="メモ" value="${esc(memo)}"></td></tr>`;
  }).join("");
  $("count").textContent = `${rows.length} / ${DATA.length} 件を表示`;
  summary();
}

function summary(){
  const n = k => DATA.filter(d => resOf(d.id) === k).length;
  const total = DATA.length, ok = n("OK"), ng = n("NG"), hold = n("保留"), na = n("対象外"), todo = n("未");
  const hi = DATA.filter(d => d.pri === "高"), hiDone = hi.filter(d => resOf(d.id) === "OK").length;
  const pct = v => (v / total * 100).toFixed(1) + "%";
  $("summary").innerHTML = `
    <div class="card"><div class="lbl">全ケース</div><div class="num">${total}</div>
      <div class="bar"><span style="width:${pct(ok)};background:var(--ok)"></span><span style="width:${pct(ng)};background:var(--ng)"></span><span style="width:${pct(hold)};background:var(--hold)"></span><span style="width:${pct(na)};background:#9aa5b1"></span></div></div>
    <div class="card"><div class="lbl">OK</div><div class="num" style="color:var(--ok)">${ok}</div></div>
    <div class="card"><div class="lbl">NG</div><div class="num" style="color:var(--ng)">${ng}</div></div>
    <div class="card"><div class="lbl">保留・対象外</div><div class="num" style="color:var(--hold)">${hold} / ${na}</div></div>
    <div class="card"><div class="lbl">未実施</div><div class="num">${todo}</div></div>
    <div class="card"><div class="lbl">優先度「高」の OK</div><div class="num">${hiDone} / ${hi.length}</div></div>`;
}

$("tbody").addEventListener("change", e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  const id = tr.dataset.id; results[id] = results[id] || {};
  if (e.target.tagName === "SELECT") { results[id].r = e.target.value; tr.className = "r-" + e.target.value; summary(); }
  else results[id].m = e.target.value;
  save();
});
["fCat","fPri","fRes","fRole"].forEach(id => $(id).addEventListener("change", render));
$("fText").addEventListener("input", render);
$("btnReset").addEventListener("click", () => { ["fCat","fPri","fRes","fRole"].forEach(id => $(id).value = ""); $("fText").value = ""; render(); });
$("btnCsv").addEventListener("click", () => {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const head = ["ID","区分","対象","ロール","優先度","結果","メモ"];
  const body = DATA.map(d => [d.id, CATS[d.cat], d.target, d.role, d.pri, resOf(d.id), (results[d.id] && results[d.id].m) || ""].map(q).join(","));
  const blob = new Blob(["﻿" + [head.map(q).join(","), ...body].join("\r\n")], {type: "text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "uds_php85_test_results.csv"; a.click();
});
render();
</script>
</body>
</html>
